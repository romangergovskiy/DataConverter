# CI: сборка и тесты DataConverter на Ubuntu, macOS и Windows.
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # false — если одна ОС упала, остальные всё равно добегут (часть 4)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure | tee test-log.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: test-log.txt

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dataconv-${{ matrix.os }}
          path: |
            build/dataconv
            build/Release/dataconv.exe
            build/dataconv.exe
          if-no-files-found: ignore
